---
name: Erlang

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

permissions:
  checks: write

jobs:
  build:
    name: Test on OTP ${{ matrix.otp_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        otp_version: ['26.2.5.14', '27.3.4.2', '28.4.1']
        rebar3_version: ['3.25.1']
        os: [ubuntu-26.04]
    env:
      OTP_VERSION: ${{ matrix.otp_version }}
    steps:
    - uses: actions/checkout@v7
    - name: Run Collector
      run: docker compose up -d
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        rebar3-version: ${{ matrix.rebar3_version }}
        version-type: 'strict'
    - uses: actions/cache@v6
      name: Cache
      with:
        path: |
          _build
        key: ${{ runner.os }}-build-${{ matrix.otp_version }}-${{ hashFiles(format('rebar.lock')) }}-5
        restore-keys: |
          ${{ runner.os }}-build-${{ matrix.otp_version }}-5-
    - name: Compile
      run: rebar3 compile
    - name: EUnit tests
      run: rebar3 eunit --cover
    - name: Common Test tests
      run: rebar3 ct --cover

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v3
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/_build/test/logs/*/junit_report.xml'

    - name: XRef
      run: rebar3 xref
    - name: Covertool
      if: ${{ always() }}
      run: rebar3 covertool generate
    - uses: codecov/codecov-action@v3
      if: ${{ always() }}
      with:
        file: _build/test/covertool/opentelemetry.covertool.xml
        env_vars: OTP_VERSION
        flags: sdk,erlang
    - uses: codecov/codecov-action@v3
      if: ${{ always() }}
      with:
        file: _build/test/covertool/opentelemetry_api.covertool.xml
        env_vars: OTP_VERSION
        flags: api,erlang
    - uses: codecov/codecov-action@v3
      if: ${{ always() }}
      with:
        file: _build/test/covertool/opentelemetry_exporter.covertool.xml
        env_vars: OTP_VERSION
        flags: exporter,erlang
    - uses: codecov/codecov-action@v3
      if: ${{ always() }}
      with:
        file: _build/test/covertool/opentelemetry_zipkin.covertool.xml
        env_vars: OTP_VERSION
        flags: zipkin,erlang
  dialyzer:
    name: Dialyze on OTP ${{ matrix.otp_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        otp_version: ['28.4.1']
        rebar3_version: ['3.25.1']
        os: [ubuntu-26.04]
    steps:
    - uses: actions/checkout@v7
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        rebar3-version: ${{ matrix.rebar3_version }}
        version-type: 'strict'
    - uses: actions/cache@v6
      name: Cache
      with:
        path: |
          _build
        key: ${{ runner.os }}-build-${{ matrix.otp_version }}-${{ hashFiles('rebar.lock') }}-5
        restore-keys: |
          ${{ runner.os }}-dialyzer-${{ matrix.otp_version }}-5-
    - name: Compile
      run: rebar3 compile
    - name: Dialyzer
      run: rebar3 as dialyzer dialyzer

  eqWAlizer:
    name: EqWAlizer on OTP ${{ matrix.otp_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        otp_version: ['28.4.1']
        rebar3_version: ['3.25.1']
        os: [ubuntu-26.04]
    steps:
    - uses: actions/checkout@v7
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        rebar3-version: ${{ matrix.rebar3_version }}
        version-type: 'strict'
    - uses: actions/cache@v6
      name: Cache
      with:
        path: |
          _build
        key: ${{ runner.os }}-build-${{ matrix.otp_version }}-${{ hashFiles('rebar.lock') }}-5
        restore-keys: |
          ${{ runner.os }}-eqWAlizer-${{ matrix.otp_version }}-5-
    - name: Download elp
      run: |
        wget https://github.com/WhatsApp/eqwalizer/releases/download/v0.17.16/elp-linux.tar.gz
        tar xvf elp-linux.tar.gz
    - name: Compile
      run: rebar3 compile
    - name: eqWAlizer
      env:
        DEBUG: 1
      run: ./elp eqwalize-all
